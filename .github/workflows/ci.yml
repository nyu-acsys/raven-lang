name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      # The result does not depend on the OS, so one runner checks it.
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      # Compiles, then runs the verifier-updater checks. The network check is on here
      # because a change to how releases are read should fail against the real GitHub
      # API, not just against the local fixture.
      - name: Compile and test
        env:
          RAVEN_TEST_NETWORK: "1"
          GITHUB_TOKEN: ${{ github.token }}
        run: npm test
