<!-- The cross is knocked out rather than painted, so it shows the editor background
     whatever the theme sets it to. Colour is VS Code's dark-theme editorError.foreground,
     the colour of the squiggle this marks. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <mask id="cross">
    <rect width="16" height="16" fill="#FFFFFF"/>
    <path d="M5.9 5.9l4.2 4.2M10.1 5.9l-4.2 4.2" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>
  </mask>
  <circle cx="8" cy="8" r="6.25" fill="#F14C4C" mask="url(#cross)"/>
</svg>
